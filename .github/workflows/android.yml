# Builds the Jalur APK (android/) signed with the release key from repo secrets.
# - Any push that touches android/: build + checks, APK kept as a workflow artifact (7 days).
# - Release apk-vX.Y.Z (must equal versionName): publishes a GitHub Release with the APK and its
#   SHA-256; a suffix (apk-v1.0.0-uji1) makes it a pre-release. Two ways to start one:
#   - Actions -> Android APK -> Run workflow on main, release_tag = apk-v1.0.0 (GitHub makes the tag;
#     Claude's cloud sessions can't push tags: the git proxy answers 403), or
#   - push the tag yourself.
# An installed APK can't be withdrawn: release only after /cek-rilis and the owner's GO.
name: Android APK

on:
  push:
    branches: ['**']
    tags: ['apk-v*']
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Publish a release, e.g. apk-v1.0.0 or apk-v1.0.0-uji1 (empty = build only)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.14.3'

      - name: Signing key from secrets
        env:
          KEY_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEY_B64" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::error::Secret ANDROID_KEYSTORE_BASE64 or ANDROID_KEYSTORE_PASSWORD is missing (Settings -> Secrets and variables -> Actions)."
            exit 1
          fi
          printf '%s' "$KEY_B64" | tr -d ' \r\n' | base64 -d > "$RUNNER_TEMP/jalur.p12" \
            || { echo "::error::ANDROID_KEYSTORE_BASE64 is not valid base64: paste the whole keystore-base64.txt."; exit 1; }
          # The keystore file itself is known: 2630 bytes with this SHA-256 (not a secret: it's a hash
          # of an encrypted file). A mismatch means the base64 secret was cut short or mangled.
          KS_SHA=$(sha256sum "$RUNNER_TEMP/jalur.p12" | cut -d' ' -f1)
          if [ "$KS_SHA" != 3f04c0d061f83f653d24c27a805f1acef1a85cd1698d1bc1fbad993ce3ba41cb ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is not the Jalur key ($(stat -c %s "$RUNNER_TEMP/jalur.p12") bytes, expected 2630). Paste the whole keystore-base64.txt (3508 characters)."
            exit 1
          fi
          echo "Keystore file OK (2630 bytes, SHA-256 matches)."
          # Pasting on a phone easily adds a space or line break at the ends: drop those.
          PW=$(printf '%s' "$KEY_PASSWORD" | tr -d '\r' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')
          echo "::add-mask::$PW"
          # Fail here, with a clear message, rather than deep inside the Gradle build.
          if ! keytool -list -storetype pkcs12 -keystore "$RUNNER_TEMP/jalur.p12" -storepass "$PW" -alias jalur > /dev/null 2>&1; then
            echo "::error::ANDROID_KEYSTORE_PASSWORD does not open the key. Paste only the password itself (one line, nothing else)."
            exit 1
          fi
          echo "JALUR_KEYSTORE=$RUNNER_TEMP/jalur.p12" >> "$GITHUB_ENV"
          echo "JALUR_KEYSTORE_PASSWORD=$PW" >> "$GITHUB_ENV"

      - name: Build
        working-directory: android
        # Launch tests (Robolectric) first: icon, geo: link, share, crash report.
        run: gradle --no-daemon testReleaseUnitTest assembleRelease

      - name: Check signature, versions and assetlinks.json
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -e
          APK=android/app/build/outputs/apk/release/app-release.apk
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          # The key must be the one .well-known/assetlinks.json vouches for, or the app shows an address bar.
          EXPECTED=c9f35defedf0e07d8a4875d504a09b0609043c62bd70554acb6acd11bbf325d3
          "$BT/apksigner" verify --print-certs "$APK" | tee certs.txt
          grep -q "SHA-256 digest: $EXPECTED" certs.txt || { echo "::error::APK is not signed with the Jalur release key"; exit 1; }
          curl -fsS https://tendorethane-code.github.io/.well-known/assetlinks.json | tr -d ' \n' \
            | grep -qi "$(echo $EXPECTED | sed 's/../&:/g; s/:$//')" || { echo "::error::assetlinks.json does not list this key"; exit 1; }
          VERSION=$(sed -n "s/.*versionName '\(.*\)'.*/\1/p" android/app/build.gradle)
          CODE=$(sed -n 's/.*versionCode \([0-9]*\).*/\1/p' android/app/build.gradle)
          "$BT/aapt2" dump badging "$APK" | head -1
          # Which release, if any: a pushed tag, or the release_tag of a manual run on main.
          TAG=""
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            TAG=$GITHUB_REF_NAME
          elif [ -n "$RELEASE_TAG" ]; then
            [ "$GITHUB_REF" = refs/heads/main ] || { echo "::error::Releases come from main only (this run is on $GITHUB_REF)."; exit 1; }
            TAG=$RELEASE_TAG
          fi
          if [ -n "$TAG" ]; then
            [[ "$TAG" =~ ^apk-v[0-9]+\.[0-9]+\.[0-9]+(-[a-z0-9]+)?$ ]] || { echo "::error::Release tag '$TAG' must look like apk-v1.2.3 or apk-v1.2.3-uji1"; exit 1; }
            TAG_VERSION=${TAG#apk-v}
            [ "${TAG_VERSION%%-*}" = "$VERSION" ] || { echo "::error::Tag $TAG does not match versionName $VERSION"; exit 1; }
            echo "RELEASE=$TAG" >> "$GITHUB_ENV"
          fi
          NAME="jalur-$VERSION.apk"
          cp "$APK" "$NAME"
          sha256sum "$NAME" | tee "$NAME.sha256"
          echo "APK_NAME=$NAME" >> "$GITHUB_ENV"
          echo "APK_VERSION=$VERSION ($CODE)" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: jalur-apk
          path: |
            ${{ env.APK_NAME }}
            ${{ env.APK_NAME }}.sha256
          retention-days: 7

      - name: GitHub Release
        if: env.RELEASE != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Pre-release only for a suffix after the version (apk-v1.0.0-uji3). The "apk-v" prefix has a
          # dash too: testing the whole tag marked apk-v1.0.0 as a pre-release, so it wasn't "latest".
          if [[ "${RELEASE#apk-v}" == *-* ]]; then FLAGS="--prerelease"; else FLAGS="--latest"; fi
          # Already published (e.g. run again to fix its flags): set the flags, never replace the files,
          # whose SHA-256 is in the notes.
          if gh release view "$RELEASE" > /dev/null 2>&1; then
            if [ "$FLAGS" = "--latest" ]; then gh release edit "$RELEASE" --prerelease=false --latest; else gh release edit "$RELEASE" --prerelease; fi
            echo "Release $RELEASE existed: flags set to $FLAGS, files left as they were."
            exit 0
          fi
          SUM=$(cut -d' ' -f1 "$APK_NAME.sha256")
          # Also as jalur.apk: a fixed name, so .../releases/latest/download/jalur.apk always gives
          # the newest official release (pre-releases are never "latest"). Same bytes, same SHA-256.
          cp "$APK_NAME" jalur.apk
          printf 'Jalur untuk Android, versi %s.\n\nCara pasang: unduh `jalur.apk` di HP, buka, izinkan "Instal aplikasi tak dikenal" buat browser/file manager-nya. Bisa dipasang di atas versi sebelumnya.\n\n`jalur.apk` dan `%s` file yang sama. SHA-256: `%s`\n' \
            "$APK_VERSION" "$APK_NAME" "$SUM" > notes.md
          # Creates the tag at this commit when it doesn't exist yet (manual run); fails if the release exists.
          gh release create "$RELEASE" jalur.apk "$APK_NAME" "$APK_NAME.sha256" --target "$GITHUB_SHA" --title "Jalur $RELEASE" --notes-file notes.md $FLAGS
