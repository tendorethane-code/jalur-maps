<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Jalur</title>
  <meta name="description" content="Pilih rute motor atau mobil sebelum berangkat: jalan gede, jalan tikus, tol atau tanpa tol, lalu buka di Google Maps.">
  <meta name="theme-color" content="#f3f4f8" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#12141a" media="(prefers-color-scheme: dark)">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Jalur">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="preconnect" href="https://maps.googleapis.com">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="map" aria-label="Peta"></div>

  <header class="search" id="search">
    <div class="rail" aria-hidden="true">
      <span class="rail-from"></span>
      <span class="rail-line"></span>
      <span class="rail-to"></span>
    </div>
    <div class="fields">
      <div class="field">
        <input id="from" type="text" placeholder="Dari mana?" autocomplete="off" enterkeyhint="search" aria-label="Dari">
        <button class="icon-btn" id="locate" type="button" title="Pakai lokasi kamu" aria-label="Pakai lokasi kamu">
          <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M12 2.5v3m0 13v3M2.5 12h3m13 0h3" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><circle cx="12" cy="12" r="6.5" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="12" cy="12" r="2.6" fill="currentColor"/></svg>
        </button>
      </div>
      <div class="field">
        <input id="to" type="text" placeholder="Mau ke mana?" autocomplete="off" enterkeyhint="search" aria-label="Ke">
      </div>
    </div>
    <button class="swap" id="swap" type="button" title="Tukar" aria-label="Tukar asal dan tujuan">
      <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M8 4v15m0 0-3.5-3.5M8 19l3.5-3.5M16 20V5m0 0-3.5 3.5M16 5l3.5 3.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <div class="modes" id="modes" role="radiogroup" aria-label="Kendaraan">
      <button type="button" role="radio" data-mode="motor" aria-checked="true">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><circle cx="5.5" cy="16.5" r="3" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="18.5" cy="16.5" r="3" fill="none" stroke="currentColor" stroke-width="2"/><path d="M5.5 16.5 9 10h5l4.5 6.5M14 10l-1.5-3H16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        Motor
      </button>
      <button type="button" role="radio" data-mode="mobil" aria-checked="false">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M4 16v-3.5l2-5h12l2 5V16M4 16h16M4 16v2.5M20 16v2.5M4 12.5h16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="7.5" cy="14.3" r="0.9" fill="currentColor"/><circle cx="16.5" cy="14.3" r="0.9" fill="currentColor"/></svg>
        Mobil
      </button>
    </div>
    <ul class="suggestions" id="suggestions" role="listbox" hidden></ul>
  </header>

  <div class="traffic" id="traffic-box">
    <button class="traffic-btn" id="traffic" type="button" aria-pressed="false" title="Tampilkan kepadatan jalan dari Google" hidden>
      <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><rect x="7.5" y="2.5" width="9" height="19" rx="3" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="12" cy="7.5" r="1.6" fill="currentColor"/><circle cx="12" cy="12" r="1.6" fill="currentColor"/><circle cx="12" cy="16.5" r="1.6" fill="currentColor"/></svg>
      <span>Macet</span>
    </button>
    <div class="traffic-legend" id="traffic-legend" title="Kepadatan dari Google, diukur buat mobil. Motor biasanya lebih cepet." hidden>
      <span><i style="background:#1e9e4a"></i>Lancar</span>
      <span><i style="background:#f29a1f"></i>Padat</span>
      <span><i style="background:#e0362c"></i>Macet</span>
      <small>(mobil)</small>
    </div>
  </div>

  <div class="pick-banner" id="pick-banner" hidden>
    <span id="pick-text">Ketuk peta buat pilih titik</span>
    <button type="button" id="pick-cancel">Batal</button>
  </div>

  <section class="sheet" id="sheet" data-size="half" aria-live="polite">
    <div class="sheet-grab" id="sheet-grab" role="button" tabindex="0" aria-label="Geser buat besarin atau kecilin"><span></span></div>
    <div class="sheet-body" id="sheet-body"></div>
    <div class="sheet-cta" id="sheet-cta" hidden></div>
  </section>

  <section class="preview" id="preview" hidden aria-live="polite"></section>

  <script type="module" src="app.js"></script>
</body>
</html>
